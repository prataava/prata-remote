# PRATA Remote — CI: build APK Agent & Controller (FINAL, Bagian 8)
# Gradle tidak bisa berjalan di VM sandbox Muse (JVM tak bisa menulis
# sesudah membaca ~/workspace), jadi APK dibangun di GitHub Actions.
# Push ke main (atau jalankan manual) -> dua APK debug di artifacts.
name: Build Android APKs

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"
  workflow_dispatch:

jobs:
  build:
    name: Assemble Agent & Controller (debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest SUDAH membawa Android SDK lengkap
      # ($ANDROID_HOME=/usr/local/lib/android/sdk). android-actions/setup-android@v3
      # RUSAK di sini: ia menjalankan `sdkmanager tools`, padahal paket `tools`
      # sudah tidak ada di cmdline-tools modern (16.0) -> exit 1 (run 43721841801).
      # Ganti dengan sdkmanager langsung untuk paket yang dipakai proyek
      # (compileSdk 35, AGP default build-tools 35.0.0). Idempotent: paket yang
      # sudah terpasang di image dilewati.
      - name: Set up Android SDK
        run: |
          CT="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$CT" ] || CT="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "sdkmanager: $CT"
          yes | "$CT" --licenses >/dev/null 2>&1 || true
          "$CT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verifikasi statis (tanpa Gradle)
        run: python3 tools/verify.py

      - name: Build Agent (debug)
        run: ./gradlew :agent:assembleDebug --stacktrace

      - name: Build Controller (debug)
        run: ./gradlew :controller:assembleDebug --stacktrace

      - name: Upload APK Agent
        uses: actions/upload-artifact@v4
        with:
          name: prata-remote-agent-debug
          path: agent/build/outputs/apk/debug/agent-debug.apk
          if-no-files-found: error

      - name: Upload APK Controller
        uses: actions/upload-artifact@v4
        with:
          name: prata-remote-controller-debug
          path: controller/build/outputs/apk/debug/controller-debug.apk
          if-no-files-found: error
